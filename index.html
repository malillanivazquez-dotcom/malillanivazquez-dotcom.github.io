<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PRIMAVERA | LUMINERE</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-left"><a href="index.html" style="text-decoration:none; color:inherit;">🏠</a></div>
        <div class="logo">LUMINERE</div>
        <div class="nav-right">
            <span>🔍</span> <span>❤️</span> <span>🛒</span> <span>👤</span>
        </div>
    </header>

    <h1 style="text-align: center; margin-top: 30px;">PRIMAVERA</h1>

    <section class="grid-productos">
        
        <div class="producto">
            <img src="primavera-1.jpg" alt="Producto">
            <h3>Polka Dot Charm</h3>
            <p>$799</p>
            <button onclick="abrirModal('Polka Dot Charm', 'Top negro con lazo y falda de volantes.', '$799')">Detalles</button>
            <button>🛒</button> <button>❤️</button>
        </div>

        <div class="producto">
            <img src="primavera-2.jpg" alt="Producto">
            <h3>Urban Stripes</h3>
            <p>$899</p>
            <button onclick="abrirModal('Urban Stripes', 'Top de rayas con falda marrón.', '$899')">Detalles</button>
            <button>🛒</button> <button>❤️</button>
        </div>

        <div class="producto">
            <img src="primavera-3.jpg" alt="Producto">
            <h3>Vintage Polka</h3>
            <p>$950</p>
            <button onclick="abrirModal('Vintage Polka', 'Top con bufanda y falda midi.', '$950')">Detalles</button>
            <button>🛒</button> <button>❤️</button>
        </div>

        <div class="producto">
            <img src="primavera-4.jpg" alt="Producto">
            <h3>Classic Dot</h3>
            <p>$750</p>
            <button onclick="abrirModal('Classic Dot', 'Vestido de lunares estilo halter.', '$750')">Detalles</button>
            <button>🛒</button> <button>❤️</button>
        </div>

    </section>

    <div id="modal" class="modal">
        <div class="modal-contenido">
            <span onclick="cerrarModal()" style="float:right; cursor:pointer; font-size:24px;">&times;</span>
            <h2 id="modal-titulo"></h2>
            <p id="modal-desc"></p>
            <p><strong>Precio: <span id="modal-precio"></span></strong></p>
            
            <label>Talla:</label>
            <select>
                <option>S</option> <option>M</option> <option>L</option>
            </select>
            <br><br>
            <button style="width: 100%;">Añadir al Carrito</button>
        </div>
    </div>

    <script>
        function abrirModal(nombre, desc, precio) {
            document.getElementById('modal-titulo').innerText = nombre;
            document.getElementById('modal-desc').innerText = desc;
            document.getElementById('modal-precio').innerText = precio;
            document.getElementById('modal').style.display = 'flex';
        }
        function cerrarModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>

</body>
</html>
