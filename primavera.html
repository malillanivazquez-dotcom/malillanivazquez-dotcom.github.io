<!-- Producto (Repite esto para los 4 productos) -->
<div class="producto">
    <img src="primavera-1.jpg" alt="Conjunto">
    <h3>Nombre Producto</h3>
    <p>$Precio</p>
    
    <!-- TRES BOTONES -->
    <button onclick="abrirModal(...)">Ver Detalles</button>
    <button>🛒</button> <!-- Añadir al carrito -->
    <button>❤️</button> <!-- Me gusta -->
</div>

<!-- En el Modal (Cuadro Flotante) -->
<div class="modal-contenido">
    <span onclick="cerrarModal()" style="float:right; cursor:pointer;">&times;</span>
    <h2 id="modal-titulo"></h2>
    <p id="modal-desc"></p>
    <p><strong>Precio: <span id="modal-precio"></span></strong></p>
    
    <!-- SELECTOR DE TALLAS -->
    <label for="tallas">Selecciona tu talla:</label>
    <select id="tallas" style="display:block; margin: 10px auto;">
        <option value="xs">XS</option>
        <option value="s">S</option>
        <option value="m">M</option>
        <option value="l">L</option>
        <option value="xl">XL</option>
        <option value="xxl">XXL</option>
    </select>
    
    <button style="margin-top: 15px;">Añadir al Carrito</button>
</div>
